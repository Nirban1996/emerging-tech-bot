name: Emerging Tech Autopost Engine

on:
  schedule:
    # This cron schedule is set for UTC time.
    # 03:00 UTC = 9:00 AM Dhaka Time
    # 07:00 UTC = 1:00 PM Dhaka Time
    # 12:00 UTC = 6:00 PM Dhaka Time
    - cron: '0 3,7,12 * * *'
  workflow_dispatch: # This allows you to click a button to run it manually anytime!

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Libraries
        run: pip install -r requirements.txt

      - name: Run Autopost Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python autopost.py
